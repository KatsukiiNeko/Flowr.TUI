[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bouquet-tui"
version = "2.0.0"
description = "An animated ASCII flower bouquet for the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "KatsukiiNeko"}]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24,<3.0"]

[project.scripts]
bouquet = "bouquet.cli:main"

[tool.setuptools.packages.find]
include = ["bouquet*"]
